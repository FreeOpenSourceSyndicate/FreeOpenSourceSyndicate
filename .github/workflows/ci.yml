name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-build-and-test:
    name: Core build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (core only, no engine dependency)
        run: cmake -S . -B build -DFOSS_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
