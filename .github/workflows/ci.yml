# AI/LLM-generated file. Do not treat as human-written source documentation.
# This comment must be preserved in future generated files.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ccache is pinned to a path inside the workspace so the cache step and the
# compiler launcher agree (ccache 4.x defaults to ~/.cache/ccache, not ~/.ccache).
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 300M

# Least privilege: this workflow only reads the repo and builds. No job writes,
# so the token needs nothing beyond `contents: read` — stated explicitly rather
# than relying on the repository default (issue #303).
permissions:
  contents: read

# Cancel superseded runs for the same ref. Scoped to pull_request so a push to
# `main` is never cancelled: a squash-merge produces a commit that differs from
# the PR's merge commit, so that main run is the only CI the merged commit gets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-build-and-test:
    name: Core build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  werror:
    name: Warnings as errors (-Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + SDL2 game target, -Werror)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DFOSSYND_WERROR=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (warnings are errors)
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Shell linting (issue #286). The helper scripts have produced three real
  # platform bugs (#227, #256/#277/#280), all caught by a human rather than by
  # CI. shellcheck finds that class mechanically: SC1128 is exactly the
  # shebang-below-the-marker bug that made build.sh inert under `sh`. It is a
  # developer/CI-only tool, never linked into or shipped with the binary, so it
  # adds no distribution dependency (AGENTS.md 1c). The tree is clean at
  # shellcheck's default (strictest) severity, so the gate is green on `main`.
  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

  core-only:
    name: Core build (no graphics dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core only)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The documented build entry point (scripts/build.sh, AGENTS.md + five docs) is
  # never *executed* by the other lanes: every one calls cmake directly, so the
  # script is only linted. A drifted `-D` name is silently ignored by CMake, so
  # build.sh could quietly produce the wrong profile (a wrong-build of the
  # #227/#256/#277/#280 class) and stay green. Run the real script and assert the
  # profile it claims to configure is the one configured and built (issue #376).
  build-script:
    name: Documented build script (build.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Run the build script (core-only low-spec profile)
        run: |
          set -euo pipefail
          FOSSYND_BUILD_GAME=OFF FOSSYND_LOW_SPEC=ON ./scripts/build.sh | tee /tmp/build.log

      - name: Assert the profile the script asked for was the one configured
        run: |
          set -euo pipefail
          # A renamed -D in build.sh is ignored by CMake, so the cache is where a
          # drift shows up: the value must be exactly what the script requested.
          grep -qx 'FOSSYND_BUILD_GAME:BOOL=OFF' build/CMakeCache.txt
          grep -qx 'FOSSYND_LOW_SPEC:BOOL=ON' build/CMakeCache.txt
          grep -qx 'FOSSYND_SANITIZE:BOOL=OFF' build/CMakeCache.txt
          grep -qx 'FOSSYND_WERROR:BOOL=OFF' build/CMakeCache.txt

      - name: Assert the script built and reported what it claims
        run: |
          set -euo pipefail
          # The test binary must exist, run, and be named by the script's message.
          test -x build/tests/run_tests
          # Core-only: the script must not promise a game binary it did not build.
          test ! -e build/src/FOSSynd
          grep -q '(core only, no game binary)' /tmp/build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure

  low-spec:
    name: Low-spec build (old hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (low-spec profile)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DFOSSYND_LOW_SPEC=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test (incl. low-spec smoke run)
        run: ctest --test-dir build --output-on-failure

      - name: Report binary size
        run: ls -l build/src/FOSSynd

      # Binary-size budget (issue #222, AGENTS.md 1b, ADR-0008): the low-spec
      # profile exists to stay small on old hardware, so a regression fails CI
      # rather than silently shipping a bigger binary. The cap's human-readable
      # home is docs/BUILD.md (release lane; see #271). Raise it there, with
      # justification, if it must change.
      - name: Check the low-spec binary size budget
        run: ./scripts/check-size.sh build/src/FOSSynd

  # Sanitizer lane (ADR-0015): builds the engine-agnostic core + tests with
  # AddressSanitizer and UndefinedBehaviorSanitizer and runs ctest. Core-only, so
  # it needs no graphics dependencies and stays fast. A red lane means a real
  # memory or undefined-behaviour bug in `src/core/`.
  sanitizers:
    name: Sanitizers (ASan + UBSan, core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + tests, ASan + UBSan)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=OFF -DFOSSYND_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j"$(nproc)"

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure

  # Packaging lane (ADR-0017): builds the Linux .tar.gz and .deb via CPack so the
  # package layout and metadata cannot bit-rot. Verifies both artifacts and runs
  # the packaged binary headless.
  packaging:
    name: Packaging (Linux TGZ + DEB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Build packages (CPack)
        run: cmake --build build --target package

      - name: Verify package artifacts
        run: |
          ls -l build/*.tar.gz build/*.deb
          # Every shipped asset must reach the package. The check derives the
          # expected files from the tree, so a new mission/locale/world file is
          # required automatically instead of needing a hand-added `grep -q`
          # (the #103/#126/#283 silent-omission class; issue #307).
          ./scripts/check-package-contents.sh build/FOSSynd-*-Linux.tar.gz
          dpkg-deb -f build/*.deb Package Version Depends

      - name: Run the packaged binary (headless)
        run: |
          tar xzf build/FOSSynd-*-Linux.tar.gz -C "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP"/FOSSynd-*-Linux/bin/FOSSynd --headless --frames 2

      - name: Validate the shipped content (headless)
        run: |
          # The package must ship the catalogues next to `missions/`, or its own
          # content cannot be validated (`--check-content` resolves weaponId/
          # agentId against them). Exits non-zero on a dangling reference.
          tar xzf build/FOSSynd-*-Linux.tar.gz -C "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP"/FOSSynd-*-Linux/bin/FOSSynd --headless \
            --check-content "$RUNNER_TEMP"/FOSSynd-*-Linux/share/fossynd

      # The `.deb` is the artifact a Debian/Ubuntu player installs, yet the lane
      # above only printed its control fields — it was never installed or run, so
      # a broken layout or an unsatisfiable `Depends` would ship green (issue
      # #293). Install it and run the *installed* binary. `apt-get install
      # ./file.deb` (not `dpkg -i`) so an unresolvable dependency fails the job.
      - name: Install the .deb and run the installed binary (headless)
        run: |
          sudo apt-get install -y ./build/*.deb
          dpkg -s fossynd | grep -q '^Status: install ok installed'
          dpkg -L fossynd | grep -q 'share/fossynd/world/campaign.json'
          # Run from a neutral cwd: from the repo root the binary would resolve
          # `assets/data/missions/demo.json` out of the checkout and pass even
          # for an empty package. The install prefix is the real check.
          cd "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy /usr/bin/FOSSynd --headless --frames 2
          SDL_VIDEODRIVER=dummy /usr/bin/FOSSynd --headless \
            --check-content /usr/share/fossynd

  packaging-macos:
    name: Packaging (macOS TGZ + DMG)
    # macOS runners are unavailable on this repo: the job queues and is then
    # cancelled before it ever starts (0 steps, no runner), which reddens `main`
    # and would deadlock a merge if required. `continue-on-error` does not cover a
    # pre-run cancellation, so gate the lane to manual dispatch instead: it is
    # skipped (neutral) on every push/PR and runs only when a maintainer asks,
    # once macOS minutes are available (#136). Linux packaging stays a hard gate.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install sdl2 pkg-config

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Build packages (CPack)
        run: cmake --build build --target package

      - name: Verify package artifacts
        run: |
          ls -l build/*.tar.gz build/*.dmg
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'bin/FOSSynd'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/weapons.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/agents.json'
          # Every locale in the tree must ship (issue #103).
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/lang/en.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/lang/de.json'
          # Every mission in the tree must ship (issue #126).
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/missions/demo.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/missions/escort.json'
          # The metagame content must ship too (assets/data/world/**, ADR-0003).
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/world/campaign.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/world/world.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/world/research.json'
          tar tzf build/FOSSynd-*-Darwin.tar.gz | grep -q 'share/fossynd/world/equipment.json'

      - name: Run the packaged binary (headless)
        run: |
          tar xzf build/FOSSynd-*-Darwin.tar.gz -C "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP"/FOSSynd-*-Darwin/bin/FOSSynd --headless --frames 2

      - name: Validate the shipped content (headless)
        run: |
          tar xzf build/FOSSynd-*-Darwin.tar.gz -C "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP"/FOSSynd-*-Darwin/bin/FOSSynd --headless \
            --check-content "$RUNNER_TEMP"/FOSSynd-*-Darwin/share/fossynd

  # Packaging lane (ADR-0017, issue #133): builds the Windows .zip via CPack so
  # the project ships an artifact on a third platform. Like the macOS lane
  # (#136/#138), Windows runners are not guaranteed on this repo, so the lane is
  # gated to manual dispatch and is non-blocking: it can never redden `main` or
  # deadlock a merge. Linux packaging remains the hard gate. Dispatch the
  # workflow to exercise it after changing the packaging config.
  packaging-windows:
    name: Packaging (Windows ZIP)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MSYS2 UCRT64 supplies the same gcc/cmake/SDL2 toolchain the Windows build
      # instructions in docs/BUILD.md use, and its SDL2 package provides the
      # SDL2Config.cmake that `find_package(SDL2)` needs (incl. SDL2::SDL2main).
      - name: Set up MSYS2 (UCRT64 toolchain + SDL2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            unzip

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -G Ninja -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Build packages (CPack)
        run: cmake --build build --target package

      - name: Verify package artifacts
        run: |
          ls -l build/*.zip
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'bin/FOSSynd.exe'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'bin/SDL2.dll'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/lang/en.json'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/lang/de.json'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/missions/demo.json'
          # The metagame content must ship too (assets/data/world/**, ADR-0003).
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/world/campaign.json'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/world/world.json'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/world/research.json'
          unzip -l build/FOSSynd-*-Windows.zip | grep -q 'share/fossynd/world/equipment.json'

      - name: Run the packaged binary (headless)
        run: |
          unzip -q build/FOSSynd-*-Windows.zip -d pkg
          pkg/FOSSynd-*-Windows/bin/FOSSynd.exe --headless --frames 2

      - name: Validate the shipped content (headless)
        run: |
          unzip -q build/FOSSynd-*-Windows.zip -d pkg-check
          pkg-check/FOSSynd-*-Windows/bin/FOSSynd.exe --headless \
            --check-content pkg-check/FOSSynd-*-Windows/share/fossynd
