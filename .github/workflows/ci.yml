# This comment must be preserved in future generated files.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ccache is pinned to a path inside the workspace so the cache step and the
# compiler launcher agree (ccache 4.x defaults to ~/.cache/ccache, not ~/.ccache).
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 300M

jobs:
  core-build-and-test:
    name: Core build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  core-only:
    name: Core build (no graphics dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core only)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  low-spec:
    name: Low-spec build (old hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (low-spec profile)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DFOSSYND_LOW_SPEC=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Test (incl. low-spec smoke run)
        run: ctest --test-dir build --output-on-failure

      - name: Report binary size
        run: ls -l build/src/FOSSynd

  # Sanitizer lane (ADR-0015): builds the engine-agnostic core + tests with
  # AddressSanitizer and UndefinedBehaviorSanitizer and runs ctest. Core-only, so
  # it needs no graphics dependencies and stays fast. A red lane means a real
  # memory or undefined-behaviour bug in `src/core/`.
  sanitizers:
    name: Sanitizers (ASan + UBSan, core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + tests, ASan + UBSan)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=OFF -DFOSSYND_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j"$(nproc)"

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure

  # Packaging lane (ADR-0017): builds the Linux .tar.gz and .deb via CPack so the
  # package layout and metadata cannot bit-rot. Verifies both artifacts and runs
  # the packaged binary headless.
  packaging:
    name: Packaging (Linux TGZ + DEB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ccache

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

      - name: Configure (core + SDL2 game target)
        run: cmake -S . -B build -DFOSSYND_BUILD_GAME=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Build packages (CPack)
        run: cmake --build build --target package

      - name: Verify package artifacts
        run: |
          ls -l build/*.tar.gz build/*.deb
          tar tzf build/FOSSynd-*-Linux.tar.gz | grep -q 'bin/FOSSynd'
          dpkg-deb -f build/*.deb Package Version Depends

      - name: Run the packaged binary (headless)
        run: |
          tar xzf build/FOSSynd-*-Linux.tar.gz -C "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP"/FOSSynd-*-Linux/bin/FOSSynd --headless --frames 2
